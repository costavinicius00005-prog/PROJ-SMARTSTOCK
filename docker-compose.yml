services:
  app:
    build: .
    container_name: meu-sistema-app
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      API_INTERNAL_URL: http://api:8080
    restart: always

  api:
    build: ./backend
    container_name: meu-sistema-api
    # Publicada so no proprio computador (127.0.0.1). O ERP web chega a API pela rede interna do
    # Docker; o app do entregador chega pelo tunel (ngrok/cloudflared rodando nesta maquina).
    # Para testar o app pela rede local sem tunel, use API_BIND=0.0.0.0 no .env.
    ports:
      - "${API_BIND:-127.0.0.1}:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    restart: always

  db:
    image: postgres:16
    container_name: meu-sistema-postgres
    # Banco acessivel apenas do proprio computador (ferramentas como DBeaver/pgAdmin continuam funcionando)
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  postgres_data:
